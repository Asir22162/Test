name: "Test — packages/logging"

on:
  push:
    paths:
      - 'packages/logging/**'
  pull_request:
    paths:
      - 'packages/logging/**'

jobs:
  test-logging:
    name: Test packages/logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Debug: environment and registry reachability
        run: |
          mkdir -p debug
          (
            echo '--- Debug: Node & pnpm ---'
            node -v || true
            pnpm -v || true
            echo '--- Corepack ---'
            corepack --version || true
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
            echo '--- npm registry ---'
            npm config get registry || true
            echo "NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}"
            echo '--- Env vars (NPM/PNPM/HTTP/REGISTRY/PROXY) ---'
            env | grep -E 'NPM|PNPM|HTTP|HTTPS|REGISTRY|PROXY' || true
            echo '--- Curl registry headers ---'
            curl -sS -I https://registry.npmjs.org/vue || true
            echo '--- Curl registry fetch ---'
            curl -sS https://registry.npmjs.org/vue -o /dev/null || true
          ) 2>&1 | tee debug/debug-info.txt
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.job }}
          path: debug/debug-info.txt
      - name: Install dependencies
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
          fi
          pnpm install --no-frozen-lockfile
          pnpm -v || true

  test-logging-node22:
    name: Test packages/logging (Node 22 compatibility)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Install dependencies
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
          fi
          pnpm install --no-frozen-lockfile
          pnpm -v || true
      - name: Run logging package tests (Node 22)
        run: pnpm -C packages/logging test --reporter dot
        continue-on-error: true
