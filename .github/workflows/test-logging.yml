name: "Test — packages/logging"

on:
  push:
    paths:
      - 'packages/logging/**'
  pull_request:
    paths:
      - 'packages/logging/**'

jobs:
  test-logging:
    name: Test packages/logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Install dependencies
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@latest --activate || true
          fi
          pnpm install --frozen-lockfile
          pnpm -v || true
      - name: Run logging package tests
        run: pnpm -C packages/logging test --reporter dot

  test-logging-node22:
    name: Test packages/logging (Node 22 compatibility)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Install dependencies
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@latest --activate || true
          fi
          pnpm install --frozen-lockfile
          pnpm -v || true
      - name: Run logging package tests (Node 22)
        run: pnpm -C packages/logging test --reporter dot
        continue-on-error: true
