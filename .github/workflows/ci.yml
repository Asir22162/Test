name: CI

on: [push, pull_request]

jobs:
  debug-environment:
    name: Debug — environment (uploads artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Debug and upload
        run: |
          mkdir -p debug
          (
            echo '--- Debug: Node & pnpm ---'
            node -v || true
            pnpm -v || true
            echo '--- Corepack ---'
            corepack --version || true
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
            echo '--- npm registry ---'
            npm config get registry || true
            echo "NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}"
            echo '--- Env vars (NPM/PNPM/HTTP/REGISTRY/PROXY) ---'
            env | grep -E 'NPM|PNPM|HTTP|HTTPS|REGISTRY|PROXY' || true
            echo '--- Curl registry headers ---'
            curl -sS -I https://registry.npmjs.org/vue || true
            echo '--- Curl registry fetch ---'
            curl -sS https://registry.npmjs.org/vue -o debug/debug-info.json || true
          ) 2>&1 | tee debug/debug-info.txt
      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-environment
          path: debug/**

  smoke-logging:
    name: Smoke — packages/logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Install
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
          fi
          pnpm install --no-frozen-lockfile
          pnpm -v || true
      - name: Check for changes affecting logging
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            logging:
              - 'packages/logging/**'
      - name: Prepare artifacts dir when skipped
        if: steps.changes.outputs.logging == 'false'
        run: |
          mkdir -p packages/logging/test-artifacts
          echo "SKIPPED" > packages/logging/test-artifacts/skip.txt
          echo "TESTS_SKIPPED=1" >> $GITHUB_ENV
      - name: Run logging package smoke tests (capture JSON results)
        shell: bash
        continue-on-error: true
        if: steps.changes.outputs.logging == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p packages/logging/test-artifacts
          # Run tests and capture JSON output and full stdout for debugging
          pnpm -C packages/logging test -- --reporter json > packages/logging/test-artifacts/test-results.json 2>&1 || true
          echo "$?" > packages/logging/test-artifacts/test-exitcode
          if [ "$(cat packages/logging/test-artifacts/test-exitcode)" -ne 0 ]; then
            echo "TESTS_FAILED=1" >> $GITHUB_ENV
          fi
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logging-smoke-results
          path: packages/logging/test-artifacts/**
      - name: Comment on PR if smoke failed
        if: ${{ env.TESTS_FAILED == '1' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const resultsPath = 'packages/logging/test-artifacts/test-results.json'
            let body = '⚠️ Smoke tests for `packages/logging` failed.'

            if (fs.existsSync(resultsPath)) {
              try {
                const content = fs.readFileSync(resultsPath, 'utf8')
                const json = JSON.parse(content)
                // Try to extract summary: tests array or stats
                let summary = ''
                if (Array.isArray(json.tests)) {
                  const total = json.tests.length
                  const passed = json.tests.filter(t => t.result && t.result.status === 'passed').length
                  const failed = json.tests.filter(t => t.result && t.result.status === 'failed').length
                  summary = `\n\n**Summary:** ${passed}/${total} passed, ${failed} failed.`
                } else if (json.numPassedTests !== undefined || json.numTotalTests !== undefined) {
                  const passed = json.numPassedTests || 0
                  const total = json.numTotalTests || 0
                  const failed = json.numFailedTests || 0
                  summary = `\n\n**Summary:** ${passed}/${total} passed, ${failed} failed.`
                } else {
                  summary = '\n\n(Unable to parse detailed test summary)'
                }
                body += summary
                body += "\n\n<details><summary>Test results (JSON)</summary>\n\n```
" + (content.substring(0, 5000) || '') + "\n```\n</details>"
              } catch (e) {
                const content = fs.readFileSync(resultsPath, 'utf8')
                body += "\n\n<details><summary>Test results (raw)</summary>\n\n```
" + content.substring(0, 5000) + "\n```\n</details>"
              }
            }

            // include metrics snapshot if present and format as Markdown table
            const metricsPath = 'packages/logging/test-artifacts/metrics.txt'
            if (fs.existsSync(metricsPath)) {
              const m = fs.readFileSync(metricsPath, 'utf8')
              // parse simple Prometheus text format into rows
              const lines = m.split('\n')
              const rows = []
              let currentRegistry = ''
              for (const line of lines) {
                if (!line.trim()) continue
                if (line.startsWith('# Registry:')) {
                  currentRegistry = line.replace('# Registry:', '').trim()
                  continue
                }
                if (line.startsWith('#')) continue
                const parts = line.trim().split(/\s+/)
                if (parts.length >= 2) {
                  const metric = parts[0]
                  const value = parts.slice(1).join(' ')
                  rows.push({ registry: currentRegistry || 'default', metric, value })
                }
              }

              if (rows.length > 0) {
                body += '\n\n**Metrics snapshot:**\n\n'
                // aggregate per-registry useful metrics and build header summary
                const aggregates = {}
                for (const r of rows) {
                  const reg = r.registry || 'default'
                  if (!aggregates[reg]) aggregates[reg] = { flushes: 0, errors: 0, writeBytes: 0, bufferLen: null }
                  const mname = r.metric
                  const val = Number(r.value)
                  if (mname.toLowerCase().includes('flush')) {
                    if (!Number.isNaN(val)) aggregates[reg].flushes += val
                  } else if (mname.toLowerCase().includes('error')) {
                    if (!Number.isNaN(val)) aggregates[reg].errors += val
                  } else if (mname.toLowerCase().includes('write_bytes') || mname.toLowerCase().includes('writebytes')) {
                    if (!Number.isNaN(val)) aggregates[reg].writeBytes += val
                  } else if (mname.toLowerCase().includes('buffer_len') || mname.toLowerCase().includes('bufferlen')) {
                    if (!Number.isNaN(val)) aggregates[reg].bufferLen = val
                  }
                }

                const totalErrors = Object.values(aggregates).reduce((s, a) => s + (a.errors || 0), 0)
                const totalFlushes = Object.values(aggregates).reduce((s, a) => s + (a.flushes || 0), 0)
                const totalBytes = Object.values(aggregates).reduce((s, a) => s + (a.writeBytes || 0), 0)

                body += `\n\n**Metrics summary:**\n\n- **Registries:** ${Object.keys(aggregates).length}\n- **Total errors:** ${totalErrors}\n- **Total flushes:** ${totalFlushes}\n- **Total bytes written:** ${totalBytes}\n\n`

                // per-registry aggregate table
                body += '| Registry | Flushes | Errors | WriteBytes | BufferLen |\n|---|---:|---:|---:|---:|\n'
                for (const [reg, agg] of Object.entries(aggregates)) {
                  body += `| ${reg} | ${agg.flushes || 0} | ${agg.errors || 0} | ${agg.writeBytes || 0} | ${agg.bufferLen != null ? agg.bufferLen : ''} |\n`
                }

                // then show detailed table (first 200 rows)
                body += '\n\n**All metrics (first 200 rows):**\n\n'
                body += '| Registry | Metric | Value |\n|---|---:|---:|\n'
                for (const r of rows.slice(0, 200)) {
                  body += `| ${r.registry} | ${r.metric} | ${r.value} |\n`
                }
                if (rows.length > 200) body += `\n*(Only first 200 metrics shown)*\n`
              } else {
                body += "\n\n**Metrics snapshot:**\n\n```
" + m.substring(0,5000) + "\n```"
              }

              // add a link to the run so reviewers can download artifacts
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
              body += `\n\n**Artifacts:** **logging-smoke-results** (attached to workflow run)\n\nRun: ${runUrl}`
            }

            const pr = github.context.payload.pull_request
            if (pr) {
              await github.rest.issues.createComment({ owner: github.context.repo.owner, repo: github.context.repo.repo, issue_number: pr.number, body })
            }
      - name: Comment on PR if smoke skipped
        if: ${{ env.TESTS_SKIPPED == '1' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v6
        with:
          script: |
            const pr = github.context.payload.pull_request
            if (pr) {
              await github.rest.issues.createComment({ owner: github.context.repo.owner, repo: github.context.repo.repo, issue_number: pr.number, body: 'ℹ️ Smoke tests for `packages/logging` were skipped because there were no relevant changes.' })
            }
      - name: Fail if tests failed
        if: ${{ env.TESTS_FAILED == '1' }}
        run: |
          echo "Smoke tests failed; failing job. See artifacts 'logging-smoke-results' for details."
          exit 1

  smoke-api:
    name: Smoke — apps/api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Debug: environment and registry reachability
        run: |
          mkdir -p debug
          (
            echo '--- Debug: Node & pnpm ---'
            node -v || true
            pnpm -v || true
            echo '--- Corepack ---'
            corepack --version || true
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
            echo '--- npm registry ---'
            npm config get registry || true
            echo "NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}"
            echo '--- Env vars (NPM/PNPM/HTTP/REGISTRY/PROXY) ---'
            env | grep -E 'NPM|PNPM|HTTP|HTTPS|REGISTRY|PROXY' || true
            echo '--- Curl registry headers ---'
            curl -sS -I https://registry.npmjs.org/vue || true
            echo '--- Curl registry fetch ---'
            curl -sS https://registry.npmjs.org/vue -o /dev/null || true
          ) 2>&1 | tee debug/debug-info.txt
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.job }}
          path: debug/debug-info.txt
      - name: Install
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
          fi
          pnpm install --no-frozen-lockfile
          pnpm -v || true
      - name: Build apps/api
        run: pnpm -C apps/api run build || true
      - name: Run migration check (sqlite)
        run: pnpm -C apps/api run migrate:check
      - name: Run API smoke (healthcheck)
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p apps/api/test-artifacts
          node apps/api/dist/main.js &
          APP_PID=$!
          sleep 1
          if curl -sS http://127.0.0.1:3000/health > apps/api/test-artifacts/health.json 2>&1; then
            echo "API_SMOKE_PASSED=1" >> $GITHUB_ENV
          else
            echo "API_SMOKE_FAILED=1" >> $GITHUB_ENV
          fi
          # capture metrics snapshot if available
          curl -sS http://127.0.0.1:3000/metrics > apps/api/test-artifacts/metrics.txt || true
          kill $APP_PID || true
      - name: Upload api smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-results
          path: apps/api/test-artifacts/**

  smoke-api-mysql:
    name: Smoke — apps/api (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm -v || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Install
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -v || true
      - name: Build apps/api
        run: pnpm -C apps/api run build
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" && break || sleep 1; done
      - name: Run migrations against MySQL
        shell: bash
        continue-on-error: true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: weapp
        run: |
          mkdir -p apps/api/test-artifacts
          node -e "require('./apps/api/dist/data-source').AppDataSource.initialize().then(ds=>ds.runMigrations()).then(()=>{console.log('migrations ran OK');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
          echo "$?" > apps/api/test-artifacts/migrations-exitcode
          if [ "$(cat apps/api/test-artifacts/migrations-exitcode)" -ne 0 ]; then
            echo "MIGRATIONS_FAILED=1" >> $GITHUB_ENV
          fi
          # create a short summary
          if [ -f apps/api/test-artifacts/migrations-exitcode ]; then
            code=$(cat apps/api/test-artifacts/migrations-exitcode)
            if [ "$code" -eq 0 ]; then
              echo "Migrations ran: OK" > apps/api/test-artifacts/summary.txt
            else
              echo "Migrations ran: FAIL (exitcode=$code)" > apps/api/test-artifacts/summary.txt
            fi
          else
            echo "Migrations: unknown (no exit code captured)" > apps/api/test-artifacts/summary.txt
          fi
          # include table listing if available
          if [ -f apps/api/test-artifacts/mysql-tables.txt ]; then
            echo "" >> apps/api/test-artifacts/summary.txt
            echo "Tables:" >> apps/api/test-artifacts/summary.txt
            tail -n 200 apps/api/test-artifacts/mysql-tables.txt >> apps/api/test-artifacts/summary.txt || true
          fi
      - name: Dump migration tables
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW TABLES" > apps/api/test-artifacts/mysql-tables.txt || true
      - name: Upload api-mysql artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-mysql-results
          path: apps/api/test-artifacts/**
      - name: Write api-mysql summary JSON
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p='apps/api/test-artifacts/summary.txt'
          summary = open(p,'r',encoding='utf8').read() if os.path.exists(p) else ''
          open('apps/api/test-artifacts/summary.json','w',encoding='utf8').write(json.dumps({'summary': summary}))
          print('wrote apps/api/test-artifacts/summary.json')
          PY
      - name: Comment on PR if smoke-mysql failed
        if: ${{ env.MIGRATIONS_FAILED == '1' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const summaryPath = 'apps/api/test-artifacts/summary.txt'
            let body = '⚠️ Smoke — `apps/api` (MySQL) migrations failed.'
            if (fs.existsSync(summaryPath)) {
              const s = fs.readFileSync(summaryPath,'utf8')
              body += `\n\n**Summary:**\n\n```\n${s.substring(0,5000)}\n```\n`
            }
            body += `\n\nArtifacts: **api-mysql-results** (attached to workflow run)\n\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  smoke-api-e2e:
    name: Smoke — apps/api (e2e)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: weapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:8.2.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd='redis-cli ping'
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Install
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -v || true
      - name: Build apps/api
        run: pnpm -C apps/api run build
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" && break || sleep 1; done
      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do redis-cli -h 127.0.0.1 ping && break || sleep 1; done
      - name: Run migrations against MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: weapp
        run: |
          mkdir -p apps/api/test-artifacts
          node -e "require('./apps/api/dist/data-source').AppDataSource.initialize().then(ds=>ds.runMigrations()).then(()=>{console.log('migrations ran OK');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Run e2e tests (auth revoke)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: weapp
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          pnpm -C apps/api test -- -t "auth e2e"
          # capture metrics from running app
          curl -sS http://127.0.0.1:3000/metrics > apps/api/test-artifacts/metrics.txt || true
      - name: Upload api-e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-results
          path: apps/api/test-artifacts/**

      - name: Comment on PR if e2e failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const pr = github.context.payload.pull_request
            const runUrl = `https://github.com/${github.context.repo.owner}/${github.context.repo.repo}/actions/runs/${github.context.runId}`
            let summary = ''
            try {
              const path = 'apps/api/test-artifacts/metrics.txt'
              if (fs.existsSync(path)) {
                summary = fs.readFileSync(path,'utf8').split('\n').slice(0,50).join('\n')
                if (summary.length > 5000) summary = summary.substring(0,5000) + '\n... (truncated)'
              }
            } catch (e) { /* ignore */ }
            if (pr) {
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
              const body = `⚠️ API e2e smoke check failed.\n\n**Metrics snapshot (first lines):**\n\n```\n${summary || '(no metrics snapshot)'}\n```\n\n**Artifacts:** **api-e2e-results** (attached to workflow run).\n\nRun: ${runUrl}\n\nPlease download the artifacts from the run to debug.`
              await github.rest.issues.createComment({ owner: github.context.repo.owner, repo: github.context.repo.repo, issue_number: pr.number, body })
            }

  smoke-grafana-provisioning:
    name: Smoke — Grafana provisioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for changes affecting grafana
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            grafana:
              - 'docs/grafana/**'
      - name: Start Grafana container
        if: steps.changes.outputs.grafana == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # start grafana with provisioning and dashboards mounted
          docker run -d --name ci-grafana \
            -e GF_SECURITY_ADMIN_PASSWORD=admin \
            -v $GITHUB_WORKSPACE/docs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro \
            -v $GITHUB_WORKSPACE/docs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro \
            -v $GITHUB_WORKSPACE/docs/grafana/dashboards:/var/lib/grafana/dashboards/auth:ro \
            -p 3000:3000 \
            grafana/grafana:latest || true
          # wait for health endpoint
          for i in $(seq 1 60); do
            if curl -sS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Grafana is up"
              break
            fi
            sleep 1
          done
      - name: Check dashboard UID exists
        if: steps.changes.outputs.grafana == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p grafana-provisioning || true
          echo "Provisioning check started: $(date)" > grafana-provisioning/summary.txt || true
          echo "Checking Grafana for dashboard UID: auth-token-revoke-dashboard"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin http://127.0.0.1:3000/api/dashboards/uid/auth-token-revoke-dashboard || true)
            echo "status=$status"
            if [ "$status" = "200" ]; then
              echo "DASHBOARD_FOUND=1" >> $GITHUB_ENV
              echo "Grafana provisioning OK — dashboard found"
              echo "Dashboard uid 'auth-token-revoke-dashboard' found" >> grafana-provisioning/summary.txt || true
              exit 0
            fi
            sleep 2
          done
          echo "::error ::Dashboard UID auth-token-revoke-dashboard not found"
          echo "Dashboard uid 'auth-token-revoke-dashboard' not found" >> grafana-provisioning/summary.txt || true
          echo "Grafana logs (tail 200):"
          docker logs ci-grafana --tail 200 || true
          exit 1

      - name: Validate dashboards from provisioning
        if: steps.changes.outputs.grafana == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          DASH_DIR="$GITHUB_WORKSPACE/docs/grafana/dashboards"
          if [ ! -d "$DASH_DIR" ]; then
            echo "No dashboards directory found at $DASH_DIR; skipping dashboard validation"
            exit 0
          fi

          failed_dir="grafana-dashboards-failed"
          rm -rf "$failed_dir" || true
          mkdir -p "$failed_dir"
          missing=0

          # find all JSON dashboards (recursive)
          while IFS= read -r -d '' file; do
            echo "Checking dashboard file: $file"
            read uid title < <(python3 - <<'PY' "$file"
import json,sys
j=json.load(open(sys.argv[1]))
uid=j.get('uid') or ''
title=j.get('title') or ''
print(uid + '\t' + title)
PY
)
            uid=$(echo "$uid" | tr -d '\r')
            title=$(echo "$title" | tr -d '\r')

            if [ -n "$uid" ]; then
              echo "Validating by uid: $uid"
              status=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin "http://127.0.0.1:3000/api/dashboards/uid/$uid" || true)
              echo "status=$status"
              if [ "$status" != "200" ]; then
                echo "::error ::Dashboard with uid $uid (file: $file) not found"
                cp "$file" "$failed_dir/"
                missing=1
              fi
            else
              # fallback to search by title
              if [ -z "$title" ]; then
                echo "::error ::Dashboard file $file has no uid or title"
                cp "$file" "$failed_dir/"
                missing=1
              else
                echo "Searching for dashboard by title: $title"
                title_enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$title")
                results=$(curl -s -u admin:admin "http://127.0.0.1:3000/api/search?query=$title_enc&type=dash-db" || true)
                found=$(python3 - <<'PY' "$title" "$results"
import sys,json
q=sys.argv[1]
try:
    items=json.loads(sys.argv[2])
except Exception:
    items=[]
for it in items:
    if it.get('title')==q:
        print('1'); sys.exit(0)
print('0')
PY
)
                if [ "$found" != "1" ]; then
                  echo "::error ::Dashboard with title '$title' (file: $file) not found"
                  cp "$file" "$failed_dir/"
                  missing=1
                fi
              fi
            fi
          done < <(find "$DASH_DIR" -type f -name '*.json' -print0)

          if [ "$missing" -ne 0 ]; then
            echo "One or more dashboards not provisioned. See $failed_dir for JSON files"
            echo "Missing dashboards:" >> grafana-provisioning/summary.txt || true
            ls "$failed_dir" -1 >> grafana-provisioning/summary.txt || true
            tar -czf "$failed_dir.tar.gz" -C "$failed_dir" . || true
            ls -la "$failed_dir" || true
            docker logs ci-grafana --tail 200 || true
            exit 1
          fi
          echo "All dashboards from provisioning validated."

      - name: Upload failed dashboards artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-failed-dashboards
          path: grafana-dashboards-failed.tar.gz

      - name: Write provisioning summary JSON
        if: always()
        run: |
          python3 - <<'PY'
import json, os
summary = ''
if os.path.exists('grafana-provisioning/summary.txt'):
    summary = open('grafana-provisioning/summary.txt','r', encoding='utf8').read()
# get grafana logs tail
try:
    glogs = os.popen('docker logs ci-grafana --tail 200 2>/dev/null').read()
except Exception:
    glogs = ''
failed_dashboards = []
if os.path.isdir('grafana-dashboards-failed'):
    failed_dashboards = [f for f in os.listdir('grafana-dashboards-failed')]
obj = {
    'summary_text': summary[:5000],
    'errors': summary.splitlines()[-50:],
    'failed_dashboards': failed_dashboards,
    'grafana_logs_tail': glogs[-8000:]
}
open('grafana-provisioning/summary.json','w', encoding='utf8').write(json.dumps(obj))
print('wrote grafana-provisioning/summary.json')
PY

      - name: Upload provisioning snapshot artifact
        if: failure()
        run: |
          mkdir -p grafana-provisioning || true
          tar -czf grafana-provisioning/provisioning-and-dashboards.tar.gz docs/grafana/provisioning docs/grafana/dashboards || true
        # upload artifact
      - name: Upload provisioning snapshot artifact (upload)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-provisioning
          path: grafana-provisioning/**

      - name: Comment on PR if provisioning failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const pr = github.context.payload.pull_request
            const runUrl = `https://github.com/${github.context.repo.owner}/${github.context.repo.repo}/actions/runs/${github.context.runId}`
            let summary = ''
            try {
              if (fs.existsSync('grafana-provisioning/summary.txt')) {
                summary = fs.readFileSync('grafana-provisioning/summary.txt', 'utf8')
                if (summary.length > 5000) summary = summary.substring(0,5000) + '\n... (truncated)'
              }
            } catch (e) { /* ignore */ }

            if (pr) {
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
              const body = `⚠️ Grafana provisioning smoke check failed.\n\n**Summary:**\n\n```\n${summary || '(no short summary available)'}\n```\n\n**Artifacts:** **grafana-provisioning** (attached to workflow run)\n\nRun: ${runUrl}\n\nPlease download the artifacts from the run to debug.`
              await github.rest.issues.createComment({ owner: github.context.repo.owner, repo: github.context.repo.repo, issue_number: pr.number, body })
            }

      - name: Check datasources from provisioning
        if: steps.changes.outputs.grafana == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          DS_FILE="$GITHUB_WORKSPACE/docs/grafana/provisioning/datasources/datasources.yml"
          if [ ! -f "$DS_FILE" ]; then
            echo "::error ::Datasources file $DS_FILE not found"
            exit 1
          fi
          echo "Parsing datasource entries (name,type,url,access) from $DS_FILE"
          entries=$(python3 - <<'PY'
import sys
p=sys.argv[1]
entries=[]
with open(p) as f:
    cur=None
    for ln in f:
        s=ln.rstrip('\n')
        if s.strip().startswith('- name:') or s.strip().startswith('name:'):
            if cur:
                entries.append(cur)
            name=s.split(':',1)[1].strip().strip('"')
            cur={'name':name,'type':'','url':'','access':''}
        elif s.strip().startswith('type:') and cur is not None:
            cur['type']=s.split(':',1)[1].strip().strip('"')
        elif s.strip().startswith('url:') and cur is not None:
            cur['url']=s.split(':',1)[1].strip().strip('"')
        elif s.strip().startswith('access:') and cur is not None:
            cur['access']=s.split(':',1)[1].strip().strip('"')
    if cur:
        entries.append(cur)
for e in entries:
    print('\t'.join([e['name'], e['type'], e['url'], e['access']]))
PY
"$DS_FILE")
          if [ -z "$entries" ]; then echo "::error ::No datasource entries found in $DS_FILE"; exit 1; fi
          echo "$entries" | while IFS=$'\t' read -r name typ url access; do
            name=$(echo "$name" | tr -d '"')
            typ=$(echo "$typ" | tr -d '"' | tr '[:upper:]' '[:lower:]')
            url=$(echo "$url" | tr -d '"')
            access=$(echo "$access" | tr -d '"' | tr '[:upper:]' '[:lower:]')
            echo "Checking datasource: $name (expected type: ${typ:-<none>}, url: ${url:-<none>}, access: ${access:-<none>})"
            name_enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$name")
            for i in $(seq 1 30); do
              ds_status=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin "http://127.0.0.1:3000/api/datasources/name/$name_enc" || true)
              echo "ds_status=$ds_status (name=$name)"
              if [ "$ds_status" = "200" ]; then
                ds_json=$(curl -s -u admin:admin "http://127.0.0.1:3000/api/datasources/name/$name_enc")
                actual_type=$(python3 - <<'PY'
import sys, json
j=json.load(sys.stdin)
print((j.get('type') or '').lower())
PY
 <<<'$ds_json')
                if [ -n "$typ" ] && [ "$typ" != "$actual_type" ]; then
                  echo "::error ::Datasource $name has type '${actual_type}', expected '${typ}'"
                  echo "Datasource JSON: $ds_json"
                  echo "Datasource $name type mismatch: actual='${actual_type}', expected='${typ}'" >> grafana-provisioning/summary.txt || true
                  docker logs ci-grafana --tail 200 || true
                  exit 1
                fi
                actual_url=$(python3 - <<'PY'
import sys,json
j=json.load(sys.stdin)
print(j.get('url') or '')
PY
 <<<'$ds_json')
                if [ -n "$url" ]; then
                  # normalize (strip trailing slash)
                  norm_expected=$(echo "$url" | sed 's:/*$::')
                  norm_actual=$(echo "$actual_url" | sed 's:/*$::')
                  if [ "$norm_expected" != "$norm_actual" ]; then
                    echo "::error ::Datasource $name url mismatch: actual='$actual_url' expected='$url'"
                    echo "Datasource JSON: $ds_json"
                    echo "Datasource $name url mismatch: actual='${actual_url}', expected='${url}'" >> grafana-provisioning/summary.txt || true
                    docker logs ci-grafana --tail 200 || true
                    exit 1
                  fi
                fi
                actual_access=$(python3 - <<'PY'
import sys,json
j=json.load(sys.stdin)
print((j.get('access') or '').lower())
PY
 <<<'$ds_json')
                if [ -n "$access" ] && [ "$access" != "$actual_access" ]; then
                  echo "::error ::Datasource $name access mismatch: actual='$actual_access' expected='$access'"
                  echo "Datasource JSON: $ds_json"
                  docker logs ci-grafana --tail 200 || true
                  exit 1
                fi
                keyName=$(echo "$name" | sed 's/[^A-Za-z0-9_]/_/g')
                echo "DATASOURCE_${keyName}_FOUND=1" >> $GITHUB_ENV
                echo "Found datasource $name and type/url/access validated: type=${actual_type:-<none>} url=${actual_url:-<none>} access=${actual_access:-<none>}"
                break
              fi
              sleep 2
            done
            if [ "$ds_status" != "200" ]; then
              echo "::error ::Datasource $name not found"
              echo "Datasource $name not found in Grafana API" >> grafana-provisioning/summary.txt || true
              docker logs ci-grafana --tail 200 || true
              exit 1
            fi
          done
          echo "All datasources from provisioning found and types/urls/access validated."
      - name: Upload grafana logs
        if: always()
        run: |
          mkdir -p grafana-logs
          docker logs ci-grafana --tail 200 > grafana-logs/ci-grafana.log || true
      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-provisioning-logs
          path: grafana-logs/**
      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-grafana || true

  smoke-grafana-demo:
    name: Smoke — Grafana demo (compose + metrics)
    runs-on: ubuntu-latest
    needs: [smoke-grafana-provisioning]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start demo compose
        run: |
          docker compose -f docs/grafana/demo-docker-compose.yml up -d
          for i in $(seq 1 60); do
            if curl -sS http://127.0.0.1:9090/-/ready >/dev/null 2>&1 && curl -sS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Services ready"
              break
            fi
            sleep 2
          done
      - name: Push sample metrics
        run: |
          node docs/grafana/push-sample-metrics.js

      - name: Capture prometheus snapshot & write demo summary
        run: |
          mkdir -p grafana-demo || true
          # save prometheus query result
          curl -sS "http://127.0.0.1:9090/api/v1/query?query=auth_revoke_count" > grafana-demo/prom_query.json || true
          # get tails of logs
          docker logs $(docker ps -q --filter ancestor=prom/prometheus:latest) --tail 200 > grafana-demo/prometheus.log || true
          docker logs $(docker ps -q --filter ancestor=prom/pushgateway:latest) --tail 200 > grafana-demo/pushgateway.log || true
          docker logs $(docker ps -q --filter ancestor=grafana/grafana:latest) --tail 200 > grafana-demo/grafana.log || true
          python3 - <<'PY'
import json,os
q=''
if os.path.exists('grafana-demo/prom_query.json'):
    q=open('grafana-demo/prom_query.json').read()
prom_lines = ''
if os.path.exists('grafana-demo/prometheus.log'):
    prom_lines=open('grafana-demo/prometheus.log').read()[-5000:]
obj={'prom_query': json.loads(q) if q else {}, 'prometheus_log_tail': prom_lines}
open('grafana-demo/summary.json','w', encoding='utf8').write(json.dumps(obj))
open('grafana-demo/summary.txt','w', encoding='utf8').write((str(obj))[:5000])
print('wrote grafana-demo summary')
PY

      - name: Wait for Prometheus to scrape sample metric
        run: |
          for i in $(seq 1 30); do
            resp=$(curl -sS "http://127.0.0.1:9090/api/v1/query?query=auth_revoke_count" || true)
            if [ -n "$resp" ]; then
              count=$(python3 - <<'PY' "$resp"
import sys, json
try:
    j=json.loads(sys.argv[1])
except Exception:
    j={}
res=j.get('data',{}).get('result',[])
print(len(res))
PY
)
              if [ "$count" -gt 0 ]; then
                echo "Prometheus scraped metric auth_revoke_count ($count samples)"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error ::Prometheus did not show 'auth_revoke_count' metric after push"
          docker logs $(docker ps -q --filter ancestor=prom/prometheus:latest) --tail 200 || true
          docker logs $(docker ps -q --filter ancestor=prom/pushgateway:latest) --tail 200 || true
          docker logs $(docker ps -q --filter ancestor=grafana/grafana:latest) --tail 200 || true
          exit 1
      - name: Upload demo logs on failure
        if: failure()
        run: |
          mkdir -p grafana-demo-logs || true
          docker logs $(docker ps -q --filter ancestor=grafana/grafana:latest) --tail 200 > grafana-demo-logs/grafana.log || true
          docker logs $(docker ps -q --filter ancestor=prom/prometheus:latest) --tail 200 > grafana-demo-logs/prometheus.log || true
          docker logs $(docker ps -q --filter ancestor=prom/pushgateway:latest) --tail 200 > grafana-demo-logs/pushgateway.log || true
      - name: Upload demo logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-demo-logs
          path: grafana-demo-logs/**

      - name: Upload demo summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-demo-summary
          path: grafana-demo/**

      - name: Comment on PR if grafana demo failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const pr = github.context.payload.pull_request
            const runUrl = `https://github.com/${github.context.repo.owner}/${github.context.repo.repo}/actions/runs/${github.context.runId}`
            let summary = ''
            try {
              if (fs.existsSync('grafana-demo/summary.txt')) {
                summary = fs.readFileSync('grafana-demo/summary.txt', 'utf8')
                if (summary.length > 5000) summary = summary.substring(0,5000) + '\n... (truncated)'
              }
            } catch (e) { /* ignore */ }
            if (pr) {
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
              const body = `⚠️ Grafana demo smoke check failed.\n\n**Summary:**\n\n```\n${summary || '(no short summary available)'}\n```\n\n**Artifacts:** **grafana-demo-logs**, **grafana-demo** (attached to workflow run).\n\nRun: ${runUrl}\n\nPlease download the artifacts from the run to debug.`
              await github.rest.issues.createComment({ owner: github.context.repo.owner, repo: github.context.repo.repo, issue_number: pr.number, body })
            }
      - name: Teardown
        if: always()
        run: |
          docker compose -f docs/grafana/demo-docker-compose.yml down || true

  build:
    needs: [smoke-logging, smoke-api, smoke-api-mysql, smoke-api-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Debug: environment and registry reachability
        run: |
          mkdir -p debug
          (
            echo '--- Debug: Node & pnpm ---'
            node -v || true
            pnpm -v || true
            echo '--- Corepack ---'
            corepack --version || true
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
            echo '--- npm registry ---'
            npm config get registry || true
            echo "NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}"
            echo '--- Env vars (NPM/PNPM/HTTP/REGISTRY/PROXY) ---'
            env | grep -E 'NPM|PNPM|HTTP|HTTPS|REGISTRY|PROXY' || true
            echo '--- Curl registry headers ---'
            curl -sS -I https://registry.npmjs.org/vue || true
            echo '--- Curl registry fetch ---'
            curl -sS https://registry.npmjs.org/vue -o /dev/null || true
          ) 2>&1 | tee debug/debug-info.txt
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.job }}
          path: debug/debug-info.txt
      - name: Install
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
          fi
          pnpm install --no-frozen-lockfile
          pnpm -v || true
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check Java version
        run: java -version
      - name: Lint
        run: pnpm -w -r run lint
      - name: Test
        run: pnpm -w -r run test

      - name: Run http-client tests (capture JSON results)
        shell: bash
        run: |
          mkdir -p packages/http-client/test-artifacts
          pnpm -C packages/http-client test -- --reporter json > packages/http-client/test-artifacts/test-results.json 2>&1 || true
          EXIT=$?
          echo "$EXIT" > packages/http-client/test-artifacts/test-exitcode
          if [ "$EXIT" -ne 0 ]; then
            echo "HTTP_CLIENT_TESTS_FAILED=1" >> $GITHUB_ENV
            echo "::error ::packages/http-client tests failed (exit code $EXIT)"
            # keep artifacts uploaded by later step, but fail the job
            exit $EXIT
          fi

      - name: Upload http-client test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-client-test-results
          path: packages/http-client/test-artifacts/**

      - name: Comment on PR if http-client tests failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const pr = github.context.payload.pull_request
            const runUrl = `https://github.com/${github.context.repo.owner}/${github.context.repo.repo}/actions/runs/${github.context.runId}`
            if (pr) {
              const body = `⚠️ **packages/http-client** tests failed in CI.\n\n**Artifacts uploaded:** 
- **http-client-test-results** (contains test-results.json and stdout)\n\n**Run details:** ${runUrl}\n\n**Next steps:** download the artifact and inspect \
- packages/http-client/test-artifacts/test-results.json (JSON Vitest output)\n- packages/http-client/test-artifacts/test-exitcode\n\nIf you want, re-run the job after pushing a fix or ask for help with failing test details.`;
              await github.rest.issues.createComment({ owner: github.context.repo.owner, repo: github.context.repo.repo, issue_number: pr.number, body })
            }

      - name: Run ops tests
        run: pnpm --filter ops... run test:ops || true

      - name: Run ops tests (watch mode dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter ops... run test:ops || true

      - name: Run publish-pacts unit tests (shared-api)
        run: pnpm --filter packages/shared-api... run test:publish

      - name: Check publish-pacts test results
        if: always()
        run: |
          if [ -f packages/shared-api/pacts/publish-results.json ]; then
            echo "--- Publish pacts unit test results ---"
            cat packages/shared-api/pacts/publish-results.json
            if grep -q '"ok": false' packages/shared-api/pacts/publish-results.json; then
              echo "::error file=packages/shared-api/pacts/publish-results.json::Publish-pacts tests found failing entries. See artifact 'publish-pacts-test-results' for details."
              exit 1
            fi
          else
            echo "No publish-results.json found from publish tests."
          fi

      - name: Upload publish-pacts test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-pacts-test-results
          path: packages/shared-api/pacts/publish-results.json || true

      - name: Build
        run: pnpm -w -r run build

      - name: Run Pact consumer tests (generate pacts)
        run: pnpm --filter packages/shared-api... run pact:consumer

      - name: Publish pacts to Pact Broker (if configured)
        if: env.PACT_BROKER_BASE_URL != '' && env.PACT_BROKER_BASE_URL != null
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          # Optional Basic auth secrets (use instead of token)
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          # Optional metadata (JSON string) and strategy ('header'|'body'|'participant_meta')
          PACT_BROKER_METADATA: ${{ secrets.PACT_BROKER_METADATA }}
          PACT_BROKER_METADATA_STRATEGY: ${{ secrets.PACT_BROKER_METADATA_STRATEGY || 'header' }}
          # Optional endpoint overrides for metadata uploads
          PACT_BROKER_META_ENDPOINT: ${{ secrets.PACT_BROKER_META_ENDPOINT }}
          PACT_BROKER_PARTICIPANT_META_ENDPOINT: ${{ secrets.PACT_BROKER_PARTICIPANT_META_ENDPOINT }}
          GITHUB_SHA: ${{ github.sha }}
          # Pass branch name as tags; support multiple tags via comma-separated secret PACT_BROKER_TAGS
          PACT_BROKER_TAGS: ${{ secrets.PACT_BROKER_TAGS || github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "Publishing pacts to broker at $PACT_BROKER_BASE_URL"
          pnpm --filter packages/shared-api... run pact:publish

      - name: Upload pact publish results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-publish-results
          path: packages/shared-api/pacts/publish-results.json || true

      - name: Show pact publish results
        if: always()
        run: |
          if [ -f packages/shared-api/pacts/publish-results.json ]; then
            echo "--- Pact publish results ---"
            cat packages/shared-api/pacts/publish-results.json
            # emit annotation if any failures
            if grep -q '"ok": false' packages/shared-api/pacts/publish-results.json; then
              echo "::error file=packages/shared-api/pacts/publish-results.json::One or more pacts failed to publish. See artifact 'pact-publish-results' for details."
              exit 1
            fi
          else
            echo "No publish-results.json found; publishing may have been skipped or failed before producing results."
          fi
      - name: Validate Shared API OpenAPI
        run: pnpm --filter packages/shared-api... run validate-openapi

      - name: Generate & check Shared API types
        id: gen-types
        run: |
          set -o pipefail
          pnpm --filter packages/shared-api... run generate-types
          # compare generated types with committed file; if different, fail the job with explicit guidance
          mv packages/shared-api/src/types.ts packages/shared-api/src/types.committed.ts
          pnpm --filter packages/shared-api... run generate-types
          if ! cmp -s packages/shared-api/src/types.committed.ts packages/shared-api/src/types.ts; then
            # Emit GitHub annotation so error appears inline in PR checks
            echo "::error file=packages/shared-api/src/types.ts,line=1,col=1::Generated types differ from committed types."
            echo "::error::To fix locally, run: pnpm --filter packages/shared-api... run generate-types && git add packages/shared-api/src/types.ts && git commit -m 'chore(shared-api): update generated types' && git push"
            echo "::error::For details see CONTRIBUTING.md in the repository root."
            # Also print to log for visibility
            echo "\nERROR: Generated types differ from committed types. To fix locally run:"
            echo "  pnpm --filter packages/shared-api... run generate-types"
            echo "  git add packages/shared-api/src/types.ts"
            echo "  git commit -m 'chore(shared-api): update generated types'"
            echo "  git push"
            exit 1;
          fi

      - name: Run Pact provider verification (PoC)
        run: pnpm --filter packages/shared-api... run pact:provider-verify


      - name: Dependency audit
        run: |
          pnpm -v || true
          # run pnpm audit if available, fall back to npm audit
          if pnpm audit --json > audit.json 2>/dev/null; then
            echo "pnpm audit output saved to audit.json"
          else
            echo "pnpm audit not available or failed; trying npm audit"
            npm audit --json > audit.json || true
          fi

      - name: Check dependency audit results (shared script)
        if: always()
        env:
          AUDIT_ALERT_WEBHOOK: ${{ secrets.AUDIT_ALERT_WEBHOOK }}
          AUDIT_ALERT_TYPE: ${{ secrets.AUDIT_ALERT_TYPE || 'slack' }}
        run: |
          # Use centralized script for audit checking (with optional alerting)
          bash ops/check-audit.sh audit.json

      - name: Dependency audit
        run: |
          pnpm -v || true
          # run pnpm audit if available, fall back to npm audit
          if pnpm audit --json > audit.json 2>/dev/null; then
            echo "pnpm audit output saved to audit.json"
          else
            echo "pnpm audit not available or failed; trying npm audit"
            npm audit --audit-level=high || true
          fi
      - name: Upload test results (placeholder)
        if: always()
        run: echo "(Add test result upload step if needed)"
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
