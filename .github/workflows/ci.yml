  compatibility-node22:
    name: Compatibility — Node 22
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
      - name: Debug: environment and registry reachability
        run: |
          mkdir -p debug
          (
            echo '--- Debug: Node & pnpm ---'
            node -v || true
            pnpm -v || true
            echo '--- Corepack ---'
            corepack --version || true
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
            echo '--- npm registry ---'
            npm config get registry || true
            echo "NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}"
            echo '--- Env vars (NPM/PNPM/HTTP/REGISTRY/PROXY) ---'
            env | grep -E 'NPM|PNPM|HTTP|HTTPS|REGISTRY|PROXY' || true
            echo '--- Curl registry headers ---'
            curl -sS -I https://registry.npmjs.org/vue || true
            echo '--- Curl registry fetch ---'
            curl -sS https://registry.npmjs.org/vue -o /dev/null || true
          ) 2>&1 | tee debug/debug-info.txt
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.job }}
          path: debug/debug-info.txt
      - name: Install
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found; enabling via corepack and preparing pnpm..."
            corepack enable || true
            corepack prepare pnpm@10.26.2 --activate || true
          fi
          pnpm install --no-frozen-lockfile
          pnpm -v || true
        run: pnpm -w -r run lint
      - name: Test (Node 22)
        # allow failures here so Node 22 remains a non-blocking compatibility check
        run: pnpm -w -r run test
        continue-on-error: true
      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node22-compatibility
          path: packages/**/test-artifacts/** || true

  check-spring-boot:
    name: Check Spring Boot version(s)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Find and validate pom.xml files
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning for pom.xml files..."
          found=0
          for p in $(git ls-files '**/pom.xml' || true); do
            echo "Checking $p"
            # Check parent declaration
            if grep -q "<artifactId>spring-boot-starter-parent</artifactId>" "$p" || grep -q "<artifactId>spring-boot-dependencies</artifactId>" "$p"; then
              # try to extract an explicit version
              ver=$(awk 'NR<=140 {print} /<artifactId>spring-boot-starter-parent</ {found=1} found && /<version>/ {match($0, /<version>([^<]+)<\/version>/, a); if (a[1] != "") {print a[1]; exit}}' "$p" || true)
              if [ -z "$ver" ]; then
                ver=$(grep -oP '(?<=<spring.boot.version>).*?(?=</spring.boot.version>)' "$p" || true)
              fi
              if [ -n "$ver" ] && [ "$ver" != "3.5.9" ]; then
                echo "ERROR: $p references Spring Boot version $ver (expected 3.5.9)"
                found=1
              fi
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "One or more pom.xml files do not reference Spring Boot 3.5.9. Failing check.";
            exit 1
          else
            echo "All detected pom.xml files either do not reference Spring Boot parent/bom or reference 3.5.9.";
          fi

  check-vue-vite:
    name: Check Vue & Vite versions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Scan package.json files for vue/vite versions
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Scanning for package.json files..."
          invalid=0
          for p in $(git ls-files '**/package.json' || true); do
            echo "Checking $p"
            vue=$(jq -r '.dependencies.vue // .devDependencies.vue // empty' "$p" || true)
            vite=$(jq -r '.devDependencies.vite // .dependencies.vite // empty' "$p" || true)
            if [ -n "$vue" ]; then
              # remove leading ^ or ~
              v=$(echo "$vue" | sed 's/^[^0-9]*//')
              major=$(echo "$v" | cut -d. -f1)
              if [ "$major" != "3" ]; then
                echo "ERROR: $p uses vue version $vue (expected major 3)"
                invalid=1
              fi
            fi
            if [ -n "$vite" ]; then
              v2=$(echo "$vite" | sed 's/^[^0-9]*//')
              major2=$(echo "$v2" | cut -d. -f1)
              if [ "$major2" != "6" ] && [ "$major2" != "7" ]; then
                echo "ERROR: $p uses vite version $vite (expected major 6 or 7)"
                invalid=1
              fi
            fi
          done
          if [ "$invalid" -eq 1 ]; then
            echo "One or more package.json files do not satisfy Vue/Vite baseline. (Non-blocking)";
            # leave non-zero code but step is allowed to continue
            exit 1
          else
            echo "All detected package.json files comply with Vue 3.x and Vite 6/7 baselines (or do not declare them).";
          fi

  mysql-smoke:
    name: MySQL — smoke (compat)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Prepare artifact dir
        run: mkdir -p packages/logging/test-artifacts
      - name: Wait for MySQL (non-blocking)
        run: |
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" > /tmp/mysql_smoke.log 2>&1; then
              echo "MySQL is ready"
              break
            fi
            sleep 1
          done
        continue-on-error: true
      - name: Run smoke queries (non-blocking)
        run: |
          mysql -h 127.0.0.1 -uroot -proot <<'SQL' > packages/logging/test-artifacts/mysql-smoke.log 2>&1 || true
          CREATE TABLE IF NOT EXISTS smoke_test (id INT PRIMARY KEY);
          INSERT IGNORE INTO smoke_test (id) VALUES (1);
          SELECT * FROM smoke_test;
          SQL
        continue-on-error: true
      - name: Upload MySQL smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-smoke-results
          path: packages/logging/test-artifacts/mysql-smoke.log || true

  redis-smoke:
    name: Redis — smoke (compat)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    services:
      redis:
        image: redis:8.2.2
        ports: ['6379:6379']
        options: >-
          --health-cmd='redis-cli ping'
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install redis tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Prepare artifact dir
        run: mkdir -p packages/logging/test-artifacts
      - name: Wait for Redis (non-blocking)
        run: |
          for i in $(seq 1 60); do
            if redis-cli -h 127.0.0.1 ping > /tmp/redis_smoke.log 2>&1; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done
        continue-on-error: true
      - name: Run Redis smoke (non-blocking)
        run: |
          redis-cli -h 127.0.0.1 set smoke_key 1 || true
          redis-cli -h 127.0.0.1 get smoke_key > packages/logging/test-artifacts/redis-smoke.log 2>&1 || true
        continue-on-error: true
      - name: Upload Redis smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-smoke-results
          path: packages/logging/test-artifacts/redis-smoke.log || true

