name: Ops tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ops-tests:
    name: Run ops tests on Node LTS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies (capture pnpm logs)
        run: |
          mkdir -p debug
          echo '--- Running pnpm install (debug mode) ---' > debug/pnpm-install.txt
          PNPM_LOG_LEVEL=debug pnpm install --recursive --silent 2>&1 | tee -a debug/pnpm-install.txt || true
      - name: Upload pnpm install artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-${{ github.job }}
          path: debug/pnpm-install.txt

      - name: Run ops tests
        env:
          NODE_ENV: test
        run: pnpm -w -C ops test:ops

  ops-tests-node22:
    name: Run ops tests (Node 22 compatibility)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies
        run: pnpm install --recursive --silent

      - name: Run ops tests (Node 22)
        env:
          NODE_ENV: test
        run: pnpm -w -C ops test:ops
        continue-on-error: true
